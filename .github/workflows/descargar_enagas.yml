name: Actualizar histórico del sistema gasista

on:
  workflow_dispatch:

  schedule:
    - cron: "30 9 * * *"

permissions:
  contents: write

concurrency:
  group: actualizacion-sistema-gasista
  cancel-in-progress: false

jobs:
  actualizar:

    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Actualizar histórico
        run: python descargar_enagas.py

      - name: Guardar histórico en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/historico_sistema_gasista.csv

          if git diff --cached --quiet; then
            echo "El histórico ya está actualizado"
            exit 0
          fi

          git commit -m "Actualizar histórico del sistema gasista"

          git pull --rebase origin main

          git push origin main
