name: Actualizar histórico del sistema gasista

on:

  workflow_dispatch:

  schedule:
    - cron: "30 16 * * *"

permissions:
  contents: write

concurrency:
  group: actualizacion-sistema-gasista
  cancel-in-progress: false

jobs:

  actualizar:

    runs-on: ubuntu-latest

    # La primera ejecución descargará desde 01/01/2025.
    # Por tanto, permitimos hasta 60 minutos.
    timeout-minutes: 60

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Actualizar histórico
        run: python descargar_enagas.py

      - name: Guardar histórico en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/historico_sistema_gasista.csv

          if git diff --cached --quiet; then
            echo "El histórico ya estaba actualizado"
          else
            git commit -m "Actualizar histórico del sistema gasista"
            git push
          fi
