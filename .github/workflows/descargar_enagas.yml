name: Descargar datos diarios Enagas

on:

  workflow_dispatch:

  schedule:
    - cron: "30 16 * * *"

permissions:
  contents: write

jobs:

  descargar:

    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Descargar Excel de Enagas
        run: python descargar_enagas.py

      - name: Guardar Excel en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No hay nuevos ficheros"
          else
            git commit -m "Actualizar datos diarios Enagas"
            git push
          fi
